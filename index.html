<style>
:root{--bg0:#04090f;--amber:#ffb43a;--amber2:#ffd97a;--cyan:#37e0ff;--cyan2:#9ff1ff;--red:#ff4d6d;--green:#3ef0a5;--line:#1e3a4d;--text:#eaf6ff;--dim:#8fb3c7}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}

.hidden{display:none!important}
#stage{position:fixed;inset:0;z-index:1}#stage canvas{display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(2,6,10,.6) 100%)}

.badge{width:72px;height:72px;display:grid;place-items:center;font-size:32px;color:var(--amber2);background:linear-gradient(160deg,#12283a,#0a1622);border:1px solid #2a4a60;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:floaty 5s ease-in-out infinite;box-shadow:0 0 30px rgba(55,224,255,.25)}
.logo-wrap{text-align:center}.logo{font-size:clamp(40px,10.5vw,78px);line-height:1.02;font-weight:900;color:#fff;text-shadow:3px 0 0 rgba(255,77,109,.5),-3px 0 0 rgba(55,224,255,.5),0 0 34px rgba(55,224,255,.35);animation:floaty 6s ease-in-out infinite}

.ping.good{color:#7fe9bd}.ping.good::before{background:var(--green);box-shadow:0 0 8px var(--green)}.ping.mid{color:#ffd97a}.ping.mid::before{background:var(--amber);box-shadow:0 0 8px var(--amber)}.ping.bad{color:#ff8fa3}.ping.bad::before{background:var(--red);box-shadow:0 0 8px var(--red)}

.mbar-gear{pointer-events:auto;width:34px;height:34px;display:grid;place-items:center;font-size:16px;color:var(--cyan2);background:#0c2231;border:1px solid var(--line);cursor:pointer;transition:.25s;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}.mbar-gear:hover{color:#fff;border-color:var(--cyan);transform:rotate(40deg)}.mbar-gear:active{transform:scale(.9)}
#menu .badge{margin-top:2px}.mbest{font-size:12px;font-weight:700;color:var(--dim);display:flex;align-items:center;gap:6px;justify-content:center}.mbest b{color:var(--amber2);font-size:14px}

function updateGame(dt){levelTime+=dt;if(endless){endlessT+=dt;endlessWaveT-=dt;if(endlessWaveT<=0){spawnEndlessWave();endlessWaveT=Math.max(2.2,5-endlessT*0.03);}const th=Math.floor(endlessT/45)%5;if(th!==endlessTheme){endlessTheme=th;setTheme(th);if(!bossActive)Music.play('l'+(th+1));}const mc=$('multChip');if(mc)mc.textContent='×'+(Math.round(scoreMult()*10)/10).toLocaleString(lang==='fa'?'fa-IR':'en-US');}while(spawnIdx<spawns.length&&spawns[spawnIdx].at<=levelTime){spawnEnemy(spawns[spawnIdx]);spawnIdx++;}updatePlayer(dt);updateEnemies(dt);updateLaser(dt);updateMissiles(dt);for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.s.position.set(b.x,b.y);b.tt-=dt;if(b.tt<=0){b.tt=0.03;spark(b.x,b.y+8,0x37e0ff,1,15,4);}}for(const b of ebullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.s.position.set(b.x,b.y);}for(const c of coinsArr){c.t+=dt;c.vx*=0.97;c.vy=c.vy*0.97+30*dt;const d=Math.hypot(c.x-player.x,c.y-player.y);const mag=d<magnetRange()&&!player.dead;if(mag){c.x+=(player.x-c.x)*dt*7;c.y+=(player.y-c.y)*dt*7;c.spT-=dt;if(c.spT<=0){c.spT=0.06;spark(c.x,c.y,0xffd97a,1,20,4);}}else{c.x+=c.vx*dt;c.y+=c.vy*dt;}c.s.position.set(c.x,c.y);c.s.scale.x=Math.max(0.15,Math.abs(Math.sin(c.t*6)))*0.85;c.s.scale.y=0.85;if(d<26&&!player.dead){c.dead=true;coins+=c.val;runCoins+=c.val;coinsDirty=true;coinsL.removeChild(c.s);SFX.coin();updateCoinsHUD();}}coinsArr=coinsArr.filter(c=>!c.dead&&c.y<H+40);for(const p of powers){p.t+=dt;p.y+=p.vy*dt;const d=Math.hypot(p.x-player.x,p.y-player.y);if(d<magnetRange()&&!player.dead){p.x+=(player.x-p.x)*dt*6;p.y+=(player.y-p.y)*dt*6;}if(d<26&&!player.dead){p.dead=true;applyPower(p);}p.cont.position.set(p.x,p.y+Math.sin(p.t*4)*3);p.gl.scale.set(1+Math.sin(p.t*5)*0.15);}powers=powers.filter(p=>{if(p.dead||p.y>H+40){powersL.removeChild(p.cont);return false;}return true;});if(bossPending){bossWait-=dt;if(bossWait<=0){bossPending=false;spawnBoss();}}if(bossActive)updateBoss(dt);collide();if(comboT>0){comboT-=dt;if(comboT<=0){combo=0;const cb=$('combo');if(cb)c function spawnEndlessWave(){const d=1+endlessT/40;const pool=['drone','drone','striker'];if(endlessT>20)pool.push('hunter');if(endlessT>45)pool.push('splitter','hunter');const type=pool[Math.floor(Math.random()*pool.length)];const n=Math.min(8,3+Math.floor(Math.random()*2+d*0.7));for(let i=0;i<n;i++)spawns.push({at:levelTime+i*0.45,type});}

function spawnLightning(){if(!lightGfx)return;lightGfx.clear();let x=W*(0.15+Math.random()*0.7),y=0;const pts=[[x,y]];while(y<H){y+=30+Math.random()*50;x+=(Math.random()-.5)*90;pts.push([x,y]);}lightGfx.moveTo(pts[0][0],pts[0][1]);for(const q of pts)lightGfx.lineTo(q[0],q[1]);lightGfx.stroke({color:0xcfefff,width:2.5,alpha:0.9});lightA=0.6;SFX.zap();addTrauma(0.12);}

224,255,.4)}.ob-idbox{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;text-align:start;padding:13px 15px;margin:0 auto 14px;background:#0c1c2a;border:1px solid #2a4a60;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}.ob-idbox::after{content:'';position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);animation:obSh 3.4s ease-in-out infinite}@keyframes obSh{0%{left:-45%}55%,100%{left:120%}}.ob-id-ico{font-size:24px;flex:none;filter:drop-shadow(0 0 8px rgba(55,224,255,.5))}.ob-id-txt{display:flex;flex-direction:column;gap:2px;min-width:0}.ob-id-txt small{font-size:11px;color:var(--dim);font-weight:700}.ob-id-txt b{font-size:19px;color:var(--amber2);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ob-desc{font-size:13.5px;color:var(--dim);line-height:1.9;margin-bottom:16px}.ob-actions{display:flex;flex-direction:column;gap:10px}.ob-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;border:1px solid var(--cyan);color:var(--text);background:#0c2231;transition:transform .12s,box-shadow .2s,filter .2s;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}.ob-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px -8px var(--cyan);filter:brightness(1.1)}.ob-btn:active{transform:translateY(1px) scale(.97)}.ob-btn.primary{border-color:#ffcf7a;color:#241300;background:linear-gradient(180deg,#ffc65c,#ff9a1f);animation:obPu 2.4s ease-in-out infinite}.ob-btn.ghost{background:transparent}@keyframes obPu{0%,100%{box-shadow:0 0 0 0 rgba(255,180,58,.4)}50%{box-shadow:0 0 26px 2px rgba(255,180,58,.2)}}.ob-inputwrap{display:flex;flex-direction:column;gap:12px;animation:obRise .4s both}#obInput{width:100%;background:#06121c;border:1px solid var(--line);color:var(--text);font-family:inherit;font-weight:800;font-size:18px;text-align:center;padding:14px;outline:none;transition:.2s}#obInput:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(55,224,255,.15)}#obInput.bad{border-color:var(--red);animation:obShk .4s}@keyframes obShk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.ob-err{font-size:12px;color:var(--red);font-weight:800;min-height:16px}.ob-inputbtns{display:flex;gap:10px}.ob-inputbtns .ob-btn{flex:1}.ob-note{margin-top:16px;font-size:11px;color:#4d6b7d}@keyframes obRise{from{opacity:0;transform:translateY(24px) scale(.97)}}`;document.head.appendChild(st);const ov=document.createElement('div');ov.id='onboard';ov.className='hidden';ov.innerHTML='<canvas id="obSky"></canvas><div class="ob-card" id="obCard"><div class="ob-sweep"></div><div class="ob-badge">✦</div><div class="ob-kicker" id="obKicker"></div><h2 class="ob-title display" id="obTitle"></h2><div class="ob-idbox" id="obIdBox"><span class="ob-id-ico">🛰️</span><div class="ob-id-txt"><small id="obIdLbl"></small><b id="obIdName" class="display"></b></div></div><p class="ob-desc" id="obDesc"></p><div class="ob-actions" id="obActions"></div><div class="ob-inputwrap hidden" id="obInputWrap"><input id="obInput" maxlength="14" dir="auto" autocomplete="off" spellcheck="false"><div class="ob-err hidden" id="obErr"></div><div class="ob-inputbtns"><button class="ob-btn ghost" id="obBack"></button><button class="ob-btn primary" id="obConfirm"></button></div></div><div class="ob-note" id="obNote"></div></div>';document.body.appendChild(ov);const _$=id=>document.getElementById(id);let skyCv,skyX,obStars=[],obAlive=false,raf=0;function neb(c,x,y,r,col){const gg=c.createRadialGradient(x,y,4,x,y,r);gg.addColorStop(0,col);gg.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=gg;c.fillRect(x-r,y-r,r*2,r*2);}function sizeSky(){skyCv.width=innerWidth;skyCv.height=innerHeight;obStars=[];for(let i=0;i<120;i++)obStars.push({x:Math.random()*skyCv.width,y:Math.random()*skyCv.height,r:Math.random()*1.5+.4,tw:Math.random()*6.28,sp:3+Math.random()*12});}function skyLoop(t){if(!obAlive)return;raf=requestAnimationFrame(skyLoop);const s=t/1000;skyX.fillStyle='#03080d';skyX.fillRect(0,0,skyCv.width,skyCv.height);skyX.globalCompositeOperation='lighter';neb(skyX,skyCv.width*.25+Math.sin(s*.08)*40,skyCv.height*.3,300,'rgba(0,150,175,.10)');neb(skyX,skyCv.width*.8,skyCv.height*.75+Math.cos(s*.07)*40,320,'rgba(255,150,60,.07)');skyX.globalCompositeOperation='source-over';skyX.fillStyle='#9fe8ff';for(const pp of obStars){pp.y-=pp.sp*.016;if(pp.y<-2){pp.y=skyCv.height+2;pp.x=Math.random()*skyCv.width;}skyX.globalAlpha=.3+Math.abs(Math.sin(s*1.4+pp.tw))*.5;skyX.fillRect(pp.x,pp.y,pp.r,pp.r);}skyX.globalAlpha=1;}function startSky(){skyCv=_$('obSky');if(!skyCv)return;skyX=skyCv.getContext('2d');sizeSky();obAlive=true;cancelAnimationFrame(raf);raf=requestAnimationFrame(skyLoop);}function stopSky(){obAlive=false;cancelAnimationFrame(raf);}addEventListener('resize',()=>{if(obAlive&&skyCv)sizeSky();});
